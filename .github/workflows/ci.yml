name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Java 17 quality gate
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rag_study_helper
        ports:
          - 19051:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports:
          - 19052:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit, integration and coverage gates
        run: >-
          mvn -gs .mvn/settings-central.xml -s .mvn/settings-central.xml -B -Pquality
          -Dapp.it.enabled=true
          -Dapp.it.mysql.host=127.0.0.1 -Dapp.it.mysql.port=19051
          -Dapp.it.mysql.database=rag_study_helper
          -Dapp.it.mysql.username=root -Dapp.it.mysql.password=root
          -Dapp.it.redis.host=127.0.0.1 -Dapp.it.redis.port=19052
          -Dapp.it.redis.database=0
          -Dredis.it.host=127.0.0.1 -Dredis.it.port=19052
          -Dredis.it.database=0
          -Dit.test=ApplicationFlowIT,RedisCoordinationIT verify

      - name: Frontend and acceptance-script syntax
        run: |
          node --check src/main/resources/static/app.js
          node --check scripts/smoke-mock-demo.mjs
          node --check scripts/evaluate-mock.mjs
          node --check scripts/chroma-collection-backup.mjs
          node --test src/test/js/ui-core.test.mjs
          python -m py_compile scripts/browser_acceptance.py
          python scripts/multi_instance_acceptance.py --help
          python scripts/restore_acceptance.py --help
          python loadtest/dry_run.py --help

      - name: Compose contracts
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose-chroma.yml config --quiet
          docker compose -f docker-compose-milvus.yml config --quiet

      - name: Dependency and secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"

  docker-browser:
    name: Fresh Docker, evaluation and browser
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rag_study_helper
        ports:
          - 19051:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports:
          - 19052:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
      chroma:
        image: chromadb/chroma:0.4.24
        env:
          IS_PERSISTENT: "TRUE"
          ANONYMIZED_TELEMETRY: "FALSE"
        ports:
          - 19053:8000
        options: >-
          --health-cmd="python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/heartbeat', timeout=3)\""
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build application image
        run: docker build --tag rag-study-helper:ci .

      - name: Final application image OS vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: rag-study-helper:ci
          scanners: vuln
          vuln-type: os
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"

      - name: Start application container
        run: |
          docker run --detach --name ragsh-ci-app \
            --add-host=host.docker.internal:host-gateway \
            --publish 127.0.0.1:19050:8080 \
            --read-only --tmpfs /tmp:size=128m,mode=1777 \
            --mount type=volume,source=ragsh-ci-inbox,target=/app/data/inbox \
            --env SERVER_ADDRESS=0.0.0.0 \
            --env SERVER_PORT=8080 \
            --env APP_HOST_PUBLISHED_LOOPBACK=true \
            --env APP_PUBLIC_ACCESS_ENABLED=false \
            --env APP_RAG_PROVIDER=mock \
            --env SPRING_DATASOURCE_URL='jdbc:mysql://host.docker.internal:19051/rag_study_helper?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true' \
            --env SPRING_DATASOURCE_USERNAME=root \
            --env SPRING_DATASOURCE_PASSWORD=root \
            --env REDIS_HOST=host.docker.internal \
            --env REDIS_PORT=19052 \
            --env REDIS_DATABASE=0 \
            --env VECTOR_STORE_TYPE=chroma \
            --env CHROMA_HOST=host.docker.internal \
            --env CHROMA_PORT=19053 \
            --env APP_VECTOR_COLLECTION=rag_study_helper_ci \
            rag-study-helper:ci
          for attempt in {1..72}; do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' ragsh-ci-app)" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          docker logs ragsh-ci-app
          exit 1

      - name: Strict Docker smoke
        run: node scripts/smoke-mock-demo.mjs http://127.0.0.1:19050

      - name: Fixed 27-question evaluation
        run: node scripts/evaluate-mock.mjs --base-url http://127.0.0.1:19050 --out target/acceptance/ci-evaluation.json

      - name: Fixed-fixture performance gate
        run: python loadtest/dry_run.py -n 20 -c 4 --output target/acceptance/ci-performance.json

      - name: Install Chromium
        run: |
          python -m pip install playwright==1.59.0
          python -m playwright install --with-deps chromium

      - name: Real browser acceptance
        run: python scripts/browser_acceptance.py

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-study-helper-acceptance
          path: |
            target/acceptance
            target/browser-acceptance
          if-no-files-found: warn

      - name: Container logs on failure
        if: failure()
        run: docker logs ragsh-ci-app

      - name: Tear down
        if: always()
        run: docker rm --force --volumes ragsh-ci-app || true
