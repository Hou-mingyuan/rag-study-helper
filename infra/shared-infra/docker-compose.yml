name: shared-infra

# Local development contract v1.0.0. Ports must stay on loopback.
services:
  mysql:
    image: mysql:8.4.8
    container_name: infra-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks: [devnet]
  redis:
    image: redis:7.4.8-alpine
    container_name: infra-redis
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [devnet]
  chroma:
    image: chromadb/chroma:0.4.24
    container_name: infra-chroma
    profiles: [study]
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - chroma-data:/chroma/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/heartbeat', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [devnet]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: infra-minio
    profiles: [storage]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${SHARED_MINIO_ACCESS_KEY:-ruoyi}
      MINIO_ROOT_PASSWORD: ${SHARED_MINIO_SECRET_KEY:-ruoyi123}
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [devnet]

networks:
  devnet:
    name: devnet
volumes:
  mysql-data:
  redis-data:
  chroma-data:
  minio-data:
