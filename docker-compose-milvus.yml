# Milvus 2.5 standalone path. MySQL, Redis and MinIO are provided by shared-infra.
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5

  milvus:
    image: milvusdb/milvus:v2.5.27
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: infra-minio:9000
      MINIO_ACCESS_KEY_ID: ${SHARED_MINIO_ACCESS_KEY:-ruoyi}
      MINIO_SECRET_ACCESS_KEY: ${SHARED_MINIO_SECRET_KEY:-ruoyi123}
      MINIO_BUCKET_NAME: ${MILVUS_BUCKET_NAME:-rag-study-helper-milvus}
    ports:
      - "127.0.0.1:${MILVUS_HOST_PORT:-19055}:19530"
      - "127.0.0.1:${MILVUS_HEALTH_HOST_PORT:-19056}:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s
    depends_on:
      etcd:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 6g
    cpus: 4.0
    networks:
      - default
      - devnet

  app:
    image: rag-study-helper:2.0.0-rc1
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      APP_HOST_PUBLISHED_LOOPBACK: "true"
      APP_PUBLIC_ACCESS_ENABLED: "false"
      SPRING_DATASOURCE_URL: "jdbc:mysql://infra-mysql:3306/rag_study_helper?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-rag}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-rag-local-app-password}
      REDIS_HOST: infra-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_DATABASE: ${REDIS_DATABASE:-3}
      APP_RAG_PROVIDER: ${APP_RAG_PROVIDER:-mock}
      APP_RAG_CHAT_API_KEY: ${APP_RAG_CHAT_API_KEY:-}
      APP_RAG_CHAT_BASE_URL: ${APP_RAG_CHAT_BASE_URL:-https://api.deepseek.com}
      APP_RAG_CHAT_MODEL_NAME: ${APP_RAG_CHAT_MODEL_NAME:-deepseek-v4-flash}
      APP_RAG_EMBEDDING_API_KEY: ${APP_RAG_EMBEDDING_API_KEY:-}
      APP_RAG_EMBEDDING_BASE_URL: ${APP_RAG_EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      APP_RAG_EMBEDDING_MODEL_NAME: ${APP_RAG_EMBEDDING_MODEL_NAME:-BAAI/bge-large-zh-v1.5}
      APP_RAG_RERANK_API_KEY: ${APP_RAG_RERANK_API_KEY:-}
      APP_RAG_RERANK_BASE_URL: ${APP_RAG_RERANK_BASE_URL:-https://api.siliconflow.cn/v1}
      APP_RAG_RERANK_MODEL_NAME: ${APP_RAG_RERANK_MODEL_NAME:-BAAI/bge-reranker-v2-m3}
      APP_RAG_SCORE_THRESHOLD: ${APP_RAG_SCORE_THRESHOLD:-0.77}
      VECTOR_STORE_TYPE: milvus
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      APP_VECTOR_COLLECTION: ${APP_VECTOR_COLLECTION:-rag_study_helper_v2}
      APP_VECTOR_REBUILD_ON_START: ${APP_VECTOR_REBUILD_ON_START:-false}
      APP_API_KEY_ENABLED: ${APP_API_KEY_ENABLED:-false}
      APP_API_KEY: ${APP_API_KEY:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_REMOTE_SPACE_ID: ${FEISHU_REMOTE_SPACE_ID:-}
      FEISHU_LOCAL_SPACE_ID: ${FEISHU_LOCAL_SPACE_ID:-1}
      FEISHU_SYNC_ENABLED: ${FEISHU_SYNC_ENABLED:-false}
      LOG_STRUCTURED_FORMAT: ${LOG_STRUCTURED_FORMAT:-ecs}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-19050}:8080"
    volumes:
      - app-inbox:/app/data/inbox
    tmpfs:
      - /tmp:size=128m,mode=1777
    read_only: true
    init: true
    depends_on:
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 240s
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 1024m
    cpus: 2.0
    networks:
      - default
      - devnet

networks:
  devnet:
    external: true

volumes:
  etcd-data:
  milvus-data:
  app-inbox:
